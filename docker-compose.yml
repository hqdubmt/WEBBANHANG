version: '3.9'

services:
  postgres:
    image: postgres:17
    container_name: commerce_postgres
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - commerce_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: commerce_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - commerce_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: commerce_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - commerce_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  qdrant:
    image: qdrant/qdrant:latest
    container_name: commerce_qdrant
    restart: always
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - commerce_network
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/6333"]
      interval: 20s
      timeout: 10s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: commerce_n8n
    restart: always
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://${N8N_HOST:-localhost}:5678
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - commerce_network
    depends_on:
      postgres:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: commerce_ollama
    restart: always
    ports:
      - "127.0.0.1:${OLLAMA_DOCKER_PORT:-11435}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - commerce_network

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: commerce_open_webui
    restart: always
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "127.0.0.1:${OPEN_WEBUI_PORT:-3050}:8080"
    volumes:
      - open_webui_data:/app/backend/data
    networks:
      - commerce_network
    depends_on:
      - ollama

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: commerce_api
    restart: always
    env_file: .env
    environment:
      APP_PORT: "3001"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - commerce_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  # web và nginx chỉ dùng cho production (docker compose --profile prod up)
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: commerce_web
    restart: always
    profiles: ["prod"]
    environment:
      API_HOST: api
      API_PORT: "3001"
    volumes:
      - web_uploads:/app/public/uploads
      - web_brand:/app/public/brand
    networks:
      - commerce_network
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: commerce_nginx
    restart: always
    profiles: ["prod"]
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./apps/web/public:/usr/share/nginx/html:ro
    networks:
      - commerce_network
    depends_on:
      - api
      - web

  prometheus:
    image: prom/prometheus:latest
    container_name: commerce_prometheus
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - commerce_network

  grafana:
    image: grafana/grafana:latest
    container_name: commerce_grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3003}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - commerce_network
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:latest
    container_name: commerce_loki
    restart: always
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - loki_data:/loki
    networks:
      - commerce_network

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: commerce_uptime_kuma
    restart: always
    ports:
      - "127.0.0.1:${UPTIME_KUMA_PORT:-3002}:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - commerce_network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
  n8n_data:
  ollama_data:
  open_webui_data:
  prometheus_data:
  grafana_data:
  loki_data:
  uptime_kuma_data:
  web_uploads:
  web_brand:

networks:
  commerce_network:
    driver: bridge
