worker_processes auto;
events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 50M;

  gzip on;
  gzip_types text/plain application/json application/javascript text/css;

  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream api {
    server 172.17.0.1:3004;
  }

  upstream pm2api {
    server 172.17.0.1:3004;
  }

  upstream minio {
    server commerce_minio:9000;
  }

  upstream web {
    server 172.17.0.1:3005;
  }

  server {
    listen 80;
    server_name _;

    # RSS feed — PM2 API (public, no auth)
    location /api/rss/ {
      proxy_pass http://pm2api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      add_header Cache-Control "public, max-age=1800";
    }

    # Next.js route handlers (brand, upload)
    location /api/brand/ {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/upload/ {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      client_max_body_size 10M;
    }

    # API Backend
    location /api/ {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 120s;
    }

    # MinIO public storage (video pipeline)
    location /storage/ {
      proxy_pass http://minio/videos/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_buffering off;
      add_header Cache-Control "public, max-age=3600";
    }

    # Health check
    location /health {
      return 200 'AI Commerce OK';
      add_header Content-Type text/plain;
    }

    # Next.js static assets — cache dài hạn (có content hash)
    location /_next/static/ {
      proxy_pass http://web;
      proxy_set_header Host $host;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js other assets
    location /_next/ {
      proxy_pass http://web;
      proxy_set_header Host $host;
    }

    # Next.js HTML pages — không cache để luôn lấy chunk hash mới nhất
    location /privacy-policy.html {
      alias /usr/share/nginx/html/privacy-policy.html;
      add_header Content-Type "text/html; charset=utf-8";
    }

    location /app_icon_1024.png {
      alias /usr/share/nginx/html/app_icon_1024.png;
      add_header Content-Type "image/png";
    }

    location /download-icon.html {
      alias /usr/share/nginx/html/download-icon.html;
      add_header Content-Type "text/html; charset=utf-8";
    }

    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_hide_header ETag;
      proxy_hide_header Last-Modified;
      add_header Cache-Control "no-store";
    }
  }
}
